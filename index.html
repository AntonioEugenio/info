<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ing. Antonio Eugenio Vidale - Software & IT Consultant</title>
    
    <!-- Tailwind CSS per lo stile rapido e responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font di sistema eleganti (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            /* Sfondo con pattern scuro molto sottile per un look tech premium */
            background-image: radial-gradient(circle at top right, #1a1a1a, #000000);
            background-attachment: fixed;
        }
        
        .glass-panel {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-link {
            transition: all 0.2s ease-in-out;
        }
        
        .btn-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.1);
        }
        
        .btn-link:active {
            transform: translateY(0);
        }

        /* Animazione per l'ingresso */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-fade-up {
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .delay-1 { animation-delay: 0.1s; opacity: 0; }
        .delay-2 { animation-delay: 0.2s; opacity: 0; }
        .delay-3 { animation-delay: 0.3s; opacity: 0; }
    </style>
</head>
<body class="min-h-screen text-gray-100 flex items-center justify-center p-4 selection:bg-gray-700 selection:text-white">

    <!-- Main Container -->
    <main class="w-full max-w-sm mx-auto animate-fade-up">
        
        <!-- Profile Card -->
        <div class="glass-panel rounded-3xl p-8 flex flex-col items-center text-center shadow-2xl relative overflow-hidden">
            
            <!-- Sottile luce di accento in alto -->
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-gray-700 via-gray-300 to-gray-700 opacity-50"></div>

            <!-- Logo (SVG Ricreato per il web) -->
            <div class="w-20 h-24 mb-6 relative">
                <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" class="w-full h-full drop-shadow-md">
                    <path d="M 5,5 L 30,5 L 45,115 L 20,115 Z" fill="#ffffff" />
                    <path d="M 40,5 L 60,5 L 53,85 L 47,85 Z" fill="#ffffff" />
                    <path d="M 70,5 L 95,5 L 80,115 L 55,115 Z" fill="#ffffff" />
                </svg>
            </div>

            <!-- Identità -->
            <h1 class="text-2xl font-extrabold tracking-wide mb-1 uppercase">Antonio E. Vidale</h1>
            <h2 class="text-sm font-semibold tracking-widest text-gray-400 mb-2">ing.</h2>
            <p class="text-xs tracking-widest text-gray-500 uppercase border-t border-gray-800 pt-2 mb-8 w-full">
                Software & IT Consultant
            </p>

            <!-- Link & Azioni -->
            <div class="w-full flex flex-col gap-4">
                
                <!-- Azione: Salva Contatto (vCard) -->
                <button id="vcard-btn" class="btn-link delay-1 animate-fade-up w-full flex items-center justify-center gap-3 bg-white text-black font-semibold rounded-xl p-4 hover:bg-gray-200">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
                    </svg>
                    Salva Contatto
                </button>

                <!-- Azione: Chiama -->
                <a href="tel:+393895410748" class="btn-link delay-2 animate-fade-up w-full flex items-center justify-between bg-gray-900 border border-gray-700 text-white rounded-xl p-4 hover:bg-gray-800">
                    <div class="flex items-center gap-3">
                        <div class="bg-gray-800 p-2 rounded-lg">
                            <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                            </svg>
                        </div>
                        <span class="font-medium">+39 389 5410748</span>
                    </div>
                </a>

                <!-- Azione: Email -->
                <a href="mailto:antonio.vidale@gmail.com" class="btn-link delay-3 animate-fade-up w-full flex items-center justify-between bg-gray-900 border border-gray-700 text-white rounded-xl p-4 hover:bg-gray-800">
                    <div class="flex items-center gap-3">
                        <div class="bg-gray-800 p-2 rounded-lg">
                            <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                            </svg>
                        </div>
                        <span class="font-medium truncate text-sm">antonio.vidale@gmail.com</span>
                    </div>
                </a>

                <!-- Azione: Mappa -->
                <a href="https://maps.apple.com/?q=Via+Contrà+Colpiano,36061,Bassano+del+Grappa,Italy" target="_blank" rel="noopener noreferrer" class="btn-link delay-3 animate-fade-up w-full flex items-center justify-between bg-gray-900 border border-gray-700 text-white rounded-xl p-4 hover:bg-gray-800">
                    <div class="flex items-center gap-3">
                        <div class="bg-gray-800 p-2 rounded-lg shrink-0">
                            <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            </svg>
                        </div>
                        <span class="font-medium text-xs text-left">Via Contrà Colpiano<br>36061 Bassano del Grappa</span>
                    </div>
                </a>

            </div>
        </div>
        
        <footer class="text-center text-xs text-gray-600 mt-6">
            <p>&copy; <span id="year"></span> ing. Antonio Eugenio Vidale.<br>Tutti i diritti riservati.</p>
        </footer>
    </main>

    <!-- JavaScript Logica -->
    <script>
        // Imposta l'anno corrente nel footer
        document.getElementById('year').textContent = new Date().getFullYear();

        // Funzione per generare e scaricare la vCard
        document.getElementById('vcard-btn').addEventListener('click', function() {
            // Costruzione stringa vCard
            const vCardData = `BEGIN:VCARD
VERSION:3.0
N:Vidale;Antonio;Eugenio;;ing.
FN:ing. Antonio Eugenio Vidale
ORG:Vidale Antonio Eugenio
TITLE:Software and IT Consultant
TEL;TYPE=WORK,VOICE:+393895410748
EMAIL;TYPE=PREF,INTERNET:antonio.vidale@gmail.com
ADR;TYPE=WORK:;;Via Contrà Colpiano;Bassano del Grappa;VI;36061;Italy
END:VCARD`;

            // Creazione di un file (Blob) in memoria
            const blob = new Blob([vCardData], { type: 'text/vcard' });
            const url = URL.createObjectURL(blob);
            
            // Creazione di un link invisibile per forzare il download
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = 'Antonio_Vidale.vcf';
            
            // Aggiungi, clicca e rimuovi il link
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
        });
    </script>
</body>
</html>
